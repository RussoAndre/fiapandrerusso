apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-auth
  namespace: argocd
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: togglemaster
  # Cascade delete: removing this Application removes the deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: togglemaster

  source:
    # Update with your real GitHub repo URL
    repoURL: https://github.com/RussoAndre/fiapandrerusso.git
    targetRevision: main
    path: gitops/apps/auth

  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from git
      selfHeal: true    # re-sync if cluster state drifts from git
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
