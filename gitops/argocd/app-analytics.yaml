apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-analytics
  namespace: argocd
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: togglemaster
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: togglemaster
  source:
    repoURL: https://github.com/RussoAndre/fiapandrerusso.git
    targetRevision: main
    path: gitops/apps/analytics
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
