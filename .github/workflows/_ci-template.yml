# ──────────────────────────────────────────────────────────────────────────────
# Reusable CI/CD workflow — called by each microservice workflow.
# Stages:
#   1. build-test    — go build + go test
#   2. lint          — golangci-lint
#   3. sast-sca      — gosec (SAST) + Trivy fs (SCA); CRITICAL = pipeline fail
#   4. docker        — build image, Trivy image scan, push to ECR with commit tag
#   5. update-gitops — patch image tag in gitops/apps/<service>/deployment.yaml
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Microservice name (auth | flag | targeting | evaluation | analytics)"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false   # required for AWS Academy temporary credentials
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true

env:
  GO_VERSION: "1.21"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. Build & Unit Test ────────────────────────────────────────────────────
  build-test:
    name: "Build & Test (${{ inputs.service }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service }}
          path: services/${{ inputs.service }}/coverage.out
          retention-days: 7

  # ── 2. Lint / Static Analysis ───────────────────────────────────────────────
  lint:
    name: "Lint (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: services/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57.2
          working-directory: services/${{ inputs.service }}
          args: --timeout=5m

  # ── 3. Security: SAST + SCA ─────────────────────────────────────────────────
  sast-sca:
    name: "Security Scan (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod

      # ── SAST: gosec ──────────────────────────────────────────────────────────
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0

      - name: Run gosec (SAST)
        working-directory: services/${{ inputs.service }}
        run: |
          gosec -fmt sarif -out gosec-results.sarif ./... || true
          gosec -severity high -confidence medium -fmt text ./...

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: services/${{ inputs.service }}/gosec-results.sarif
          category: gosec-${{ inputs.service }}
        continue-on-error: true   # SARIF upload needs Advanced Security (free on public repos)

      # ── SCA: Trivy filesystem scan ────────────────────────────────────────────
      - name: Run Trivy SCA (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service }}
          format: table
          exit-code: "1"          # fail the pipeline on CRITICAL findings
          ignore-unfixed: true
          severity: CRITICAL      # block only on CRITICAL vulnerabilities
          output: trivy-sca-${{ inputs.service }}.txt

      - name: Upload Trivy SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-${{ inputs.service }}
          path: trivy-sca-${{ inputs.service }}.txt
          retention-days: 14

  # ── 4. Docker Build, Image Scan & Push to ECR ───────────────────────────────
  docker:
    name: "Docker Build & Push (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: [lint, sast-sca]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          echo "uri=${REPO}/togglemaster/${{ inputs.service }}:v1.0.0-${IMAGE_TAG:0:8}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.uri }}" \
            services/${{ inputs.service }}

      # ── Container scan with Trivy ───────────────────────────────────────────
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          output: trivy-image-${{ inputs.service }}.txt

      - name: Upload Trivy image scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ inputs.service }}
          path: trivy-image-${{ inputs.service }}.txt
          retention-days: 14

      - name: Push image to ECR
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Export image URI for GitOps step
        run: echo "IMAGE_URI=${{ steps.image.outputs.uri }}" >> "$GITHUB_ENV"

    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

  # ── 5. Update GitOps repository ─────────────────────────────────────────────
  update-gitops:
    name: "Update GitOps (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: docker
    # Only update GitOps on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch image tag in GitOps manifest
        run: |
          MANIFEST="gitops/apps/${{ inputs.service }}/deployment.yaml"
          NEW_IMAGE="${{ needs.docker.outputs.image_uri }}"

          # Replace the image line using sed — works for any tag format
          sed -i "s|image: .*togglemaster/${{ inputs.service }}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST}"

          echo "Updated ${MANIFEST} to use ${NEW_IMAGE}"
          cat "${MANIFEST}"

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "gitops/apps/${{ inputs.service }}/deployment.yaml"

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — image tag unchanged."
          else
            git commit -m "chore(gitops): update ${{ inputs.service }} image to v1.0.0-${IMAGE_TAG:0:8}"
            git push
          fi
