on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      aws_account_id:
        required: true
        type: string
      aws_region:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false

env:
  GO_VERSION: "1.21"

jobs:
  build-test:
    name: "Build & Test (${{ inputs.service }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod
      - run: go mod download
      - run: go build -v ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service }}
          path: services/${{ inputs.service }}/coverage.out
          retention-days: 7

  lint:
    name: "Lint (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57.2
          working-directory: services/${{ inputs.service }}
          args: --timeout=5m

  sast-sca:
    name: "Security Scan (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ inputs.service }}/go.mod
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0
      - name: Run gosec (SAST)
        working-directory: services/${{ inputs.service }}
        run: gosec -severity high -confidence medium -fmt text ./...
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  docker:
    name: "Docker Build & Push (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: [lint, sast-sca]
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          TAG="v1.0.0-${GITHUB_SHA:0:8}"
          URI="${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/togglemaster/${{ inputs.service }}:${TAG}"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${{ steps.image.outputs.uri }}" services/${{ inputs.service }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push image to ECR
        run: docker push "${{ steps.image.outputs.uri }}"

  update-gitops:
    name: "Update GitOps (${{ inputs.service }})"
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch image tag
        run: |
          MANIFEST="gitops/apps/${{ inputs.service }}/deployment.yaml"
          NEW_IMAGE="${{ needs.docker.outputs.image_uri }}"
          sed -i "s|image: .*togglemaster/${{ inputs.service }}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "gitops/apps/${{ inputs.service }}/deployment.yaml"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(gitops): update ${{ inputs.service }} to v1.0.0-${GITHUB_SHA:0:8}"
            git push
          fi
