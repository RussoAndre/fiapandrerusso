name: "Demo — Security Block (DevSecOps)"

# ──────────────────────────────────────────────────────────────────────────────
# This workflow exists ONLY for the Tech Challenge video demonstration.
#
# How to use:
#   1. Create a branch: git checkout -b demo/security-failure
#   2. Edit services/auth/go.mod to add a vulnerable dependency (see README)
#   3. Push the branch — this workflow will trigger and FAIL at the Trivy step
#   4. Revert the change, push again — the workflow passes
#
# The workflow mirrors the production CI template but is triggered on any branch
# named demo/* so it doesn't affect main branch protection.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - "demo/**"
    paths:
      - "services/auth/**"

env:
  GO_VERSION: "1.21"

jobs:
  build-test:
    name: "1 — Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth/go.mod
      - run: go mod download
      - run: go build -v ./...
      - run: go test -v -race ./...

  lint:
    name: "2 — Lint"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57.2
          working-directory: services/auth

  # ── SECURITY GATE — this job will FAIL if a CRITICAL vulnerability is found ─
  security-gate:
    name: "3 — Security Gate (BLOCKS on CRITICAL)"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Run gosec (SAST)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth/go.mod

      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0
      - name: gosec scan
        working-directory: services/auth
        run: gosec -severity high -confidence medium ./...

      - name: "Trivy SCA — CRITICAL vulnerabilities block the pipeline"
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: fs
          scan-ref: services/auth
          format: table
          # exit-code 1 means the pipeline FAILS when CRITICAL is found
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: "Security Gate PASSED ✅"
        run: echo "No CRITICAL vulnerabilities found. Pipeline may proceed."
